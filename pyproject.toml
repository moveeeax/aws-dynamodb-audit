[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-dynamodb-audit"
version = "0.2.0"
description = "Audit DynamoDB tables for missing PITR, weak encryption, wasted capacity and pointless GSIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "dynamodb", "audit", "cost-optimization", "sre", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.43"]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]

[project.scripts]
aws-dynamodb-audit = "aws_dynamodb_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-dynamodb-audit"
Issues = "https://github.com/moveeeax/aws-dynamodb-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
